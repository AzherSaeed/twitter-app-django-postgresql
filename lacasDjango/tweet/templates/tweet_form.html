{% extends 'layout.html' %}

{% block title %}Tweet Form{% endblock %}

{% block content %}

<div class="container">

    {% if form.instance.pk %}
    <h1>Tweet Upldate</h1>
    {% else %}
    <h1>Tweet Create</h1>
    {% endif %}

    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

{% endblock %}
