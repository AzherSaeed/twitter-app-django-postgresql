{% extends 'layout.html' %}

{% block title %}Tweet App{% endblock %}

{% block content %}
<a class="btn btn-primary mb-9" href="{% url 'create_tweet' %}" role="button">Create Tweet</a>

<div class="container row gap-3">
    {% for tweet in tweets %}
    <div class="card" style="width: 22rem;">
        {% if tweet.photo %}
        <img class="card-img-top" src="{{ tweet.photo.url }}" alt="Tweet image">
        {% endif %}
        <div class="card-body">
            <h5 class="card-title">{{ tweet.user }}</h5>
            <p class="card-text">{{ tweet.text }}</p>

            <div class="btn-group">
                <a href="{% url 'edit_tweet' tweet.id %}" class="btn btn-secondary">Edit</a>
                <a href="{% url 'delete_tweet' tweet.id %}" class="btn btn-danger">Delete</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
